<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ITZIK SOUND — Music Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">IS</div><div><b>ITZIK SOUND</b><small>AI MUSIC STUDIO</small></div></div>
    <button class="new-project" id="newProject">＋ פרויקט חדש</button>
    <div class="nav-label">הסטודיו שלך</div>
    <nav id="navigation">
      <button class="nav-item active" data-page="home"><span>⌂</span> מסך ראשי</button>
      <button class="nav-item" data-page="mix"><span>☷</span> מיקס AI</button>
      <button class="nav-item" data-page="master"><span>◉</span> מאסטרינג AI</button>
      <button class="nav-item" data-page="pitch"><span>♬</span> תיקון זיופים</button>
      <button class="nav-item" data-page="ideas"><span>✧</span> רעיונות מוזיקליים</button>
      <button class="nav-item" data-page="reference"><span>◎</span> סטודיו רפרנסים</button>
      <button class="nav-item" data-page="assistant"><span>✳</span> איצקו AI <i class="status-dot"></i></button>
      <button class="nav-item" data-page="projects"><span>▤</span> הפרויקטים שלי</button>
      <button class="nav-item" data-page="settings"><span>⚙</span> הגדרות ושפה</button>
      <button class="nav-item" data-page="help"><span>?</span> עזרה ותמיכה</button>
    </nav>
    <div class="sidebar-bottom"><div class="profile-avatar">א</div><div><b>האולפן שלי</b><small>גרסה ראשונית</small></div><span class="online-dot"></span></div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div><div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div><div class="top-title" id="topTitle">הסטודיו שלך, הסאונד שלך.</div></div>
      <div class="top-actions"><span class="connection"><i></i> ממשק מקומי פעיל</span><button class="icon-button" title="עזרה" data-go="help">?</button></div>
    </header>
    <section id="pageContent" class="page-content"></section>
  </main>
</div>

<footer class="player-bar">
  <div class="track-info"><div class="cover">♫</div><div><b id="trackName">עדיין לא נבחר שיר</b><small id="trackMeta">העלה קובץ כדי להתחיל</small></div></div>
  <div class="player-controls"><button id="playBtn" class="play-button" disabled>▶</button><div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" disabled><span id="duration">0:00</span></div></div>
  <div class="player-right"><span id="playerStatus">ממתין לקובץ</span><button id="exportBtn" class="export-button" disabled>ייצוא</button></div>
  <audio id="audio" preload="metadata"></audio>
</footer>
<div class="modal-backdrop" id="exportModal" hidden>
  <div class="export-modal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <button class="modal-close" id="closeExport" aria-label="סגירה">×</button>
    <div class="quick-icon">⇩</div><h2 id="exportTitle">ייצוא השיר</h2>
    <p>בחר פורמט להורדת קובץ האודיו שהעלית.</p>
    <label for="exportFormat">פורמט קובץ</label>
    <select id="exportFormat"><option value="wav">WAV — איכות מלאה</option><option value="mp3">MP3 — קובץ דחוס</option></select>
    <label for="mp3Bitrate" id="bitrateLabel" hidden>איכות MP3</label>
    <select id="mp3Bitrate" hidden><option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="256">256 kbps</option><option value="320">320 kbps</option></select>
    <button class="primary-btn" id="startExport">הורדת הקובץ</button>
    <div id="exportStatus" class="export-status" role="status"></div>
  </div>
</div>
<input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac" hidden>
<script src="/vendor/lame.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
