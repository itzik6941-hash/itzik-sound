<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="robots" content="noindex,nofollow">
  <title>ITZIK SOUND — עבודות תחזוקה</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/maintenance.css">
</head>
<body>
  <main class="maintenance-card">
    <div class="brand-mark" aria-hidden="true">IS</div>
    <p class="eyebrow">ITZIK SOUND</p>
    <h1>האתר נמצא כרגע בעבודות</h1>
    <p class="intro">אנחנו עובדים על שדרוג ושיפור חוויית האולפן כדי לחזור עם מערכת טובה ומתקדמת יותר.</p>
    <p class="access-note">הגישה לאולפן מוגבלת כרגע למנהל בלבד.</p>
    <form id="adminLogin" novalidate>
      <label for="adminCode">קוד מנהל</label>
      <div class="input-row">
        <input id="adminCode" name="code" type="password" inputmode="numeric" autocomplete="one-time-code" required aria-describedby="loginMessage" aria-label="קוד מנהל">
        <button id="loginButton" type="submit"><span class="button-label">כניסה לאולפן</span><span class="spinner" aria-hidden="true"></span></button>
      </div>
      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
    </form>
    <div class="status-line"><i></i><span>ITZIK SOUND · STUDIO ACCESS</span></div>
  </main>
  <script src="/maintenance.js" defer></script>
</body>
</html>
